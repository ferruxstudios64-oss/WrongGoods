name: Deploy WrongGoods landing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"

permissions:
  contents: read

concurrency:
  group: wronggoods-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARETOKEN }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm current Cloudflare deployments
        run: pnpm exec wrangler deployments list --config landing/wrangler.production.jsonc

      - name: Deploy existing production Worker
        run: pnpm exec wrangler deploy --config landing/wrangler.production.jsonc

      - name: Verify live site and signup contract
        run: node landing/verify.mjs https://wronggoods.com
