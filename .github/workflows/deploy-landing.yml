name: Deploy WrongGoods landing

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: wronggoods-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated verification
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --config landing/wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
